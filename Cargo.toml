[workspace]
resolver = "2"
members = [
    "crates/application",
    "crates/backend",
    "crates/db",
    "crates/mys",
]
default-members = ["crates/backend"]

[workspace.package]
version = "0.1.0"
authors = ["Trrrrw <wzhhenry@qq.com>"]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
akasha-application = { path = "crates/application" }
akasha-db = { path = "crates/db" }
akasha-mys = { path = "crates/mys" }
chrono = { version = "0.4.45", features = ["clock"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
