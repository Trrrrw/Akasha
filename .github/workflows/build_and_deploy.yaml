name: Build Backend

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "crates/**"
      - ".github/workflows/build_and_deploy.yaml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "crates/**"
      - ".github/workflows/build_and_deploy.yaml"

permissions:
  contents: read
  packages: write

env:
  ALIYUN_REGISTRY: crpi-73ao84573omk8qlo.cn-hangzhou.personal.cr.aliyuncs.com
  ALIYUN_NAMESPACE: akasha
  AKASHA_BACKEND_IMAGE_NAME: akasha-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Alibaba Cloud ACR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push Akasha backend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: akasha
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=akasha-backend
          cache-to: type=gha,scope=akasha-backend,mode=max
          tags: |
            ghcr.io/trrrrw/${{ env.AKASHA_BACKEND_IMAGE_NAME }}:latest
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.AKASHA_BACKEND_IMAGE_NAME }}:latest
